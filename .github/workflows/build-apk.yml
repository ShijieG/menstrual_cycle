name: Build Debug APK

# 让你无需本地安装 Android Studio / SDK：
# 把代码推到 GitHub 后，GitHub 免费云服务器会自动编译并产出可安装的调试 APK。
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # 允许在 Actions 页手动触发

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不再依赖第三方 Android setup action（易因版本/网络失败），改为纯命令行安装 SDK
      - name: Set up Android SDK (command-line tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 工程未附带 Gradle Wrapper，这里直接指定 Gradle 8.6（与 AGP 8.4 兼容）
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: menstrual-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
